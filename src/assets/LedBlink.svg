<svg
  viewBox="0 0 260 180"
  width="260"
  height="180"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Pico board with blinking LED"
>
  <!-- Background -->
  <rect width="260" height="180" rx="12" fill="#0f1720" />

  <!-- Board body -->
  <rect x="40" y="35" width="180" height="95" rx="6" fill="#0f1b12" stroke="#2a3a2e" stroke-width="1.5" />

  <!-- USB port -->
  <rect x="30" y="65" width="16" height="22" rx="2" fill="#888" stroke="#666" stroke-width="1" />
  <rect x="33" y="69" width="10" height="14" rx="1" fill="#555" />

  <!-- GPIO pin headers - top row -->
  <circle cx="60" cy="42" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="76" cy="42" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="92" cy="42" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="108" cy="42" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="124" cy="42" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="140" cy="42" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="156" cy="42" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="172" cy="42" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="188" cy="42" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="204" cy="42" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />

  <!-- GPIO pin headers - bottom row -->
  <circle cx="60" cy="123" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="76" cy="123" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="92" cy="123" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="108" cy="123" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="124" cy="123" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="140" cy="123" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="156" cy="123" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="172" cy="123" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="188" cy="123" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />
  <circle cx="204" cy="123" r="2.5" fill="#888" stroke="#666" stroke-width="0.5" />

  <!-- Chip -->
  <rect x="100" y="60" width="40" height="30" rx="3" fill="#1a1a2e" stroke="#333" stroke-width="1" />
  <text x="120" y="79" text-anchor="middle" fill="#9AA6A0" font-size="7" font-family="monospace">
    Pico
  </text>

  <!-- Onboard LED -->
  <circle cx="185" cy="55" r="5" fill="#C66F2F" />
  <!-- Pulse ring -->
  <circle cx="185" cy="55" r="10" fill="none" stroke="#C66F2F" stroke-width="1" stroke-dasharray="3 2" opacity="0.5" />
  <circle cx="185" cy="55" r="15" fill="none" stroke="#C66F2F" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.25" />

  <!-- Label -->
  <text x="130" y="155" text-anchor="middle" fill="#9AA6A0" font-size="11" font-family="sans-serif">
    Slow double-blink
  </text>
</svg>
