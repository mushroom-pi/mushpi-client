<svg
  viewBox="0 0 260 180"
  width="260"
  height="180"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Phone showing Wi-Fi settings"
>
  <!-- Background -->
  <rect width="260" height="180" rx="12" fill="#0f1720" />

  <!-- Phone outline -->
  <rect x="75" y="10" width="110" height="160" rx="12" fill="#0f1720" stroke="#9AA6A0" stroke-width="1.5" />

  <!-- Status bar -->
  <rect x="85" y="18" width="90" height="12" rx="2" fill="transparent" />
  <!-- Signal bars -->
  <rect x="88" y="26" width="2" height="3" fill="#9AA6A0" />
  <rect x="91" y="24" width="2" height="5" fill="#9AA6A0" />
  <rect x="94" y="22" width="2" height="7" fill="#9AA6A0" />
  <rect x="97" y="20" width="2" height="9" fill="#9AA6A0" />
  <!-- Battery -->
  <rect x="160" y="22" width="12" height="6" rx="1" fill="none" stroke="#9AA6A0" stroke-width="0.8" />
  <rect x="161" y="23" width="8" height="4" rx="0.5" fill="#3C8D5A" />

  <!-- Wi-Fi heading -->
  <text x="130" y="46" text-anchor="middle" fill="#E6F0EA" font-size="12" font-weight="bold" font-family="sans-serif">
    Wi-Fi
  </text>

  <!-- Network list -->
  <!-- Highlighted network -->
  <rect x="85" y="54" width="90" height="22" rx="4" fill="#C66F2F" opacity="0.15" stroke="#C66F2F" stroke-width="1" />
  <!-- Lock icon (open) -->
  <rect x="90" y="62" width="6" height="5" rx="1" fill="none" stroke="#C66F2F" stroke-width="0.8" />
  <path d="M91 62 V60 A2 2 0 0 1 95 60" fill="none" stroke="#C66F2F" stroke-width="0.8" />
  <!-- SSID text -->
  <text x="100" y="68" fill="#C66F2F" font-size="7" font-weight="bold" font-family="monospace">
    mushpi-provision
  </text>
  <!-- Signal bars (full) -->
  <rect x="163" y="66" width="2" height="3" fill="#C66F2F" />
  <rect x="166" y="64" width="2" height="5" fill="#C66F2F" />
  <rect x="169" y="62" width="2" height="7" fill="#C66F2F" />

  <!-- Other networks -->
  <!-- Network 0 -->
  <g>
    <rect x="85" y="80" width="90" height="18" rx="4" fill="transparent" stroke="#2a3a2e" stroke-width="0.5" />
    <!-- Lock icon (closed) -->
    <rect x="90" y="87" width="6" height="5" rx="1" fill="none" stroke="#9AA6A0" stroke-width="0.8" />
    <path d="M91 87 V85 A2 2 0 0 1 95 85 V87" fill="none" stroke="#9AA6A0" stroke-width="0.8" />
    <!-- Network name placeholder -->
    <rect x="100" y="88" width="40" height="4" rx="1" fill="#9AA6A0" opacity="0.4" />
    <!-- Signal bars (partial) -->
    <rect x="163" y="90" width="2" height="3" fill="#9AA6A0" opacity="0.6" />
    <rect x="166" y="88" width="2" height="5" fill="#9AA6A0" opacity="0.6" />
    <rect x="169" y="86" width="2" height="7" fill="#9AA6A0" opacity="0.4" />
  </g>

  <!-- Network 1 -->
  <g>
    <rect x="85" y="102" width="90" height="18" rx="4" fill="transparent" stroke="#2a3a2e" stroke-width="0.5" />
    <!-- Lock icon (closed) -->
    <rect x="90" y="109" width="6" height="5" rx="1" fill="none" stroke="#9AA6A0" stroke-width="0.8" />
    <path d="M91 109 V107 A2 2 0 0 1 95 107 V109" fill="none" stroke="#9AA6A0" stroke-width="0.8" />
    <!-- Network name placeholder -->
    <rect x="100" y="110" width="48" height="4" rx="1" fill="#9AA6A0" opacity="0.4" />
    <!-- Signal bars (partial) -->
    <rect x="163" y="112" width="2" height="3" fill="#9AA6A0" opacity="0.45" />
    <rect x="166" y="110" width="2" height="5" fill="#9AA6A0" opacity="0.45" />
    <rect x="169" y="108" width="2" height="7" fill="#9AA6A0" opacity="0.3" />
  </g>

  <!-- Network 2 -->
  <g>
    <rect x="85" y="124" width="90" height="18" rx="4" fill="transparent" stroke="#2a3a2e" stroke-width="0.5" />
    <!-- Lock icon (closed) -->
    <rect x="90" y="131" width="6" height="5" rx="1" fill="none" stroke="#9AA6A0" stroke-width="0.8" />
    <path d="M91 131 V129 A2 2 0 0 1 95 129 V131" fill="none" stroke="#9AA6A0" stroke-width="0.8" />
    <!-- Network name placeholder -->
    <rect x="100" y="132" width="56" height="4" rx="1" fill="#9AA6A0" opacity="0.4" />
    <!-- Signal bars (partial) -->
    <rect x="163" y="134" width="2" height="3" fill="#9AA6A0" opacity="0.3" />
    <rect x="166" y="132" width="2" height="5" fill="#9AA6A0" opacity="0.3" />
  </g>
</svg>
