<svg
  viewBox="0 0 260 180"
  width="260"
  height="180"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Browser window showing provisioning URL"
>
  <!-- Background -->
  <rect width="260" height="180" rx="12" fill="#0f1720" />

  <!-- Browser window -->
  <rect x="20" y="15" width="220" height="150" rx="8" fill="#0f1b12" stroke="#2a3a2e" stroke-width="1.5" />

  <!-- Title bar -->
  <rect x="20" y="15" width="220" height="24" rx="8" fill="#2a3a2e" />
  <rect x="20" y="31" width="220" height="8" fill="#2a3a2e" />
  <!-- Window dots -->
  <circle cx="34" cy="27" r="4" fill="#e74c3c" opacity="0.7" />
  <circle cx="46" cy="27" r="4" fill="#f39c12" opacity="0.7" />
  <circle cx="58" cy="27" r="4" fill="#3C8D5A" opacity="0.7" />

  <!-- Address bar -->
  <rect x="70" y="20" width="160" height="14" rx="4" fill="#0f1720" stroke="#C66F2F" stroke-width="1" />
  <text x="150" y="30" text-anchor="middle" fill="#C66F2F" font-size="7.5" font-family="monospace" font-weight="bold">
    http://192.168.4.1:5000
  </text>

  <!-- Page content area -->
  <!-- Logo area -->
  <circle cx="130" cy="65" r="12" fill="#C66F2F" opacity="0.2" stroke="#C66F2F" stroke-width="1" />
  <text x="130" y="69" text-anchor="middle" fill="#C66F2F" font-size="10" font-weight="bold" font-family="sans-serif">
    M
  </text>

  <!-- Input fields -->
  <rect x="65" y="88" width="130" height="14" rx="3" fill="#0f1720" stroke="#9AA6A0" stroke-width="0.8" />
  <text x="75" y="98" fill="#9AA6A0" font-size="7" font-family="sans-serif" opacity="0.6">
    Wi-Fi SSID
  </text>

  <rect x="65" y="108" width="130" height="14" rx="3" fill="#0f1720" stroke="#9AA6A0" stroke-width="0.8" />
  <text x="75" y="118" fill="#9AA6A0" font-size="7" font-family="sans-serif" opacity="0.6">
    Password
  </text>

  <!-- Submit button -->
  <rect x="90" y="130" width="80" height="18" rx="4" fill="#C66F2F" />
  <text x="130" y="142" text-anchor="middle" fill="#E6F0EA" font-size="8" font-weight="bold" font-family="sans-serif">
    Connect
  </text>
</svg>
